<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <nav id="navbar">
        <div id="logo">
            <img src="logo.png" alt="Infinite Learning">
            <h1 id="title">Infinite Learning</h1>
        </div>
        <ul>
            <li><a href="home.html" class="home-btn">Home</a></li>
            <li><a href="#" id="logout-btn">Logout</a></li>
        </ul>
    </nav>

    <main id="profile-section">
        <h2 class="section-title">Profile Details</h2>
        <form id="profile-form">
            <div class="form-group">
                <!-- kept id 'full-name' to avoid breaking CSS; label updated -->
                <label for="full-name">First Name:</label>
                <input type="text" id="full-name" disabled>
            </div>
            <div class="form-group">
                <!-- kept id 'branch' to avoid breaking CSS; label updated -->
                <label for="branch">Last Name:</label>
                <input type="text" id="branch" disabled>
            </div>
            <div class="form-group">
                <!-- kept id 'year' to avoid breaking CSS; label updated -->
                <label for="year">Age:</label>
                <input type="text" id="year" disabled>
            </div>
            <div class="form-group">
                <!-- roll-number field is now the user's Email; changed type to email and label -->
                <label for="roll-number">Email:</label>
                <input type="email" id="roll-number" disabled>
            </div>
            <div class="form-group">
                <!-- this input was previously the 'email' field; now it's the New Password -->
                <label for="email">New Password:</label>
                <input type="password" id="email" disabled placeholder="">
            </div>
            <div class="form-group">
                <!-- this input was previously 'password'; now it's Confirm Password -->
                <label for="password">Confirm Password:</label>
                <input type="password" id="password" value="********" disabled>
            </div>

            <div class="button-group">
                <button type="button" id="edit-btn">Edit</button>
                <button type="button" id="save-btn" disabled>Save</button>
                <button type="button" id="cancel-btn" disabled>Cancel</button>
            </div>
        </form>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const user = JSON.parse(localStorage.getItem('user'));

            if (!user) {
                alert('Please log in first.');
                window.location.href = 'login.html';
                return;
            }

            // Utility to safely read server fields with fallback
            function safeField(obj, ...keys) {
                for (const k of keys) {
                    if (obj && obj[k] !== undefined && obj[k] !== null) return obj[k];
                }
                return '';
            }

            try {
                const response = await fetch(`http://localhost:5000/api/user/${encodeURIComponent(user.email)}`);
                const userData = await response.json();

                if (response.ok) {
                    // try new keys first, then fall back to older names to be robust
                    document.getElementById('full-name').value = safeField(userData, 'firstName', 'fullName');
                    document.getElementById('branch').value = safeField(userData, 'lastName', 'branch');
                    document.getElementById('year').value = safeField(userData, 'age', 'year');
                    // roll-number now holds the user's email
                    document.getElementById('roll-number').value = safeField(userData, 'email', 'rollNo');
                    // password fields remain masked by default
                    document.getElementById('email').value = '';
                    document.getElementById('password').value = '********';
                } else {
                    alert('Error fetching user details.');
                }
            } catch (error) {
                console.error('Error fetching user data:', error);
                alert('Error connecting to server.');
            }

            document.getElementById('logout-btn').addEventListener('click', function () {
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            });

            const editButton = document.getElementById('edit-btn');
            const saveButton = document.getElementById('save-btn');
            const cancelButton = document.getElementById('cancel-btn');

            // include all inputs so password can be edited too
            const inputs = document.querySelectorAll('#profile-form input');

            // Save initial values (for cancel)
            function getCurrentValues() {
                return Array.from(inputs).map(i => i.value);
            }
            let initialValues = getCurrentValues();

            editButton.addEventListener('click', () => {
                inputs.forEach(input => input.disabled = false);
                // when enabling password editing, clear masked placeholder so user can type
                if (document.getElementById('password').value === '********') {
                    document.getElementById('password').value = '';
                }
                saveButton.disabled = false;
                cancelButton.disabled = false;
                editButton.disabled = true;
            });

            cancelButton.addEventListener('click', () => {
                // restore previous values and disable inputs
                inputs.forEach((input, idx) => {
                    input.value = initialValues[idx];
                    input.disabled = true;
                });
                saveButton.disabled = true;
                cancelButton.disabled = true;
                editButton.disabled = false;
            });

            saveButton.addEventListener('click', async () => {
                // Gather updated values according to the mappings we used:
                const firstNameVal = document.getElementById('full-name').value.trim();
                const lastNameVal  = document.getElementById('branch').value.trim();
                const ageVal       = document.getElementById('year').value.trim();
                const emailVal     = document.getElementById('roll-number').value.trim(); // this now holds email
                const newPassword  = document.getElementById('email').value; // new password field
                const confirmPass  = document.getElementById('password').value; // confirm password field

                const updatedUser = {
                    firstName: firstNameVal,
                    lastName: lastNameVal,
                    age: ageVal,
                    email: emailVal
                };

                // If the user typed any new password, validate confirmation
                const newPasswordEntered = (newPassword !== undefined && newPassword !== null && newPassword.trim() !== '');
                const confirmValEntered = (confirmPass !== undefined && confirmPass !== null && confirmPass.trim() !== '');

                if (newPasswordEntered || confirmValEntered) {
                    // Both should be provided and must match
                    if (!newPasswordEntered || !confirmValEntered) {
                        alert('Please enter the new password in both fields (New Password and Confirm Password).');
                        return;
                    }
                    if (newPassword !== confirmPass) {
                        alert('New password and confirm password do not match.');
                        return;
                    }
                    updatedUser.password = newPassword;
                }

                try {
                    const response = await fetch('http://localhost:5000/api/update-profile', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedUser)
                    });

                    if (response.ok) {
                        // Do not store password in localStorage
                        const toStore = Object.assign({}, updatedUser);
                        delete toStore.password;
                        localStorage.setItem('user', JSON.stringify(toStore));

                        alert('Profile details updated successfully!');
                        // Reset password fields to masked/empty after success
                        document.getElementById('email').value = '';
                        document.getElementById('password').value = '********';
                        // update initial values snapshot
                        initialValues = getCurrentValues();
                    } else {
                        const err = await response.json().catch(()=>null);
                        alert((err && err.message) ? ('Error updating profile: ' + err.message) : 'Error updating profile.');
                        return;
                    }
                } catch (error) {
                    console.error('Error updating user:', error);
                    alert('Error connecting to server.');
                    return;
                }

                // disable inputs again after save
                inputs.forEach(input => input.disabled = true);
                saveButton.disabled = true;
                cancelButton.disabled = true;
                editButton.disabled = false;
            });

        });
    </script>
</body>
</html>
