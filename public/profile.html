<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <nav id="navbar">
        <div id="logo">
            <img src="logo.png" alt="Infinite Learning">
            <h1 id="title">Infinite Learning</h1>
        </div>
        <ul>
            <li><a href="home.html" class="home-btn">Home</a></li>
            <li><a href="#" id="logout-btn">Logout</a></li>
        </ul>
    </nav>

    <main id="profile-section">
        <h2 class="section-title">Profile Details</h2>
        <form id="profile-form">
            <div class="form-group">
                <label for="full-name">Full Name:</label>
                <input type="text" id="full-name" disabled>
            </div>
            <div class="form-group">
                <label for="branch">Branch:</label>
                <input type="text" id="branch" disabled>
            </div>
            <div class="form-group">
                <label for="year">Year of Study:</label>
                <input type="text" id="year" disabled>
            </div>
            <div class="form-group">
                <label for="roll-number">Roll Number:</label>
                <input type="text" id="roll-number" disabled>
            </div>
            <div class="form-group">
                <label for="email">Email ID:</label>
                <input type="email" id="email" disabled>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" value="********" disabled>
            </div>

            <div class="button-group">
                <button type="button" id="edit-btn">Edit</button>
                <button type="button" id="save-btn" disabled>Save</button>
                <button type="button" id="cancel-btn" disabled>Cancel</button>
            </div>
        </form>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            const user = JSON.parse(localStorage.getItem('user'));
    
            if (!user) {
                alert('Please log in first.');
                window.location.href = 'login.html';
                return;
            }
    
            try {
                const response = await fetch(`http://localhost:5000/api/user/${user.email}`);
                const userData = await response.json();
    
                if (response.ok) {
                    document.getElementById('full-name').value = userData.fullName;
                    document.getElementById('branch').value = userData.branch;
                    document.getElementById('year').value = userData.year;
                    document.getElementById('roll-number').value = userData.rollNo;
                    document.getElementById('email').value = userData.email;
                } else {
                    alert('Error fetching user details.');
                }
            } catch (error) {
                console.error('Error fetching user data:', error);
                alert('Error connecting to server.');
            }
    
            document.getElementById('logout-btn').addEventListener('click', function () {
                localStorage.removeItem('user');
                window.location.href = 'login.html';
            });
    
            const editButton = document.getElementById('edit-btn');
            const saveButton = document.getElementById('save-btn');
            const cancelButton = document.getElementById('cancel-btn');
            const inputs = document.querySelectorAll('#profile-form input:not([type="password"])');
    
            editButton.addEventListener('click', () => {
                inputs.forEach(input => input.disabled = false);
                saveButton.disabled = false;
                cancelButton.disabled = false;
                editButton.disabled = true;
            });
    
            cancelButton.addEventListener('click', () => {
                inputs.forEach(input => input.disabled = true);
                saveButton.disabled = true;
                cancelButton.disabled = true;
                editButton.disabled = false;
            });

            saveButton.addEventListener('click', async () => {
                const updatedUser = {
                    fullName: document.getElementById('full-name').value,
                    branch: document.getElementById('branch').value,
                    year: document.getElementById('year').value,
                    rollNo: document.getElementById('roll-number').value,
                    email: document.getElementById('email').value
                };

                // Get the password input value
                const passwordInput = document.getElementById('password');
                
                // Only include password in the update if it has been changed from the default value
                if (passwordInput.value !== '********' && passwordInput.value.trim() !== '') {
                    updatedUser.password = passwordInput.value;
                }

                try {
                    const response = await fetch('http://localhost:5000/api/update-profile', {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(updatedUser)
                    });

                    if (response.ok) {
                        // Don't store password in localStorage
                        delete updatedUser.password;
                        localStorage.setItem('user', JSON.stringify(updatedUser));

                        alert('Profile details updated successfully!');
                        // Reset password field to default masked value
                        passwordInput.value = '********';
                    } else {
                        alert('Error updating profile.');
                    }
                } catch (error) {
                    console.error('Error updating user:', error);
                    alert('Error connecting to server.');
                }

                inputs.forEach(input => input.disabled = true);
                saveButton.disabled = true;
                cancelButton.disabled = true;
                editButton.disabled = false;
            });

        });

    </script>
   
    
    
</body>
</html>
